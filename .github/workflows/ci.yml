name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Syntax-check every module so a typo can't ship to GitHub Pages.
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done

      # Unit tests plus the privacy guards (CSP, no network APIs, no data files tracked).
      - name: Tests
        run: npm test
